services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      LAB_USER_DIR: /app/user
      CACHE_DIR: /app/cache
      LOG_DIR: /app/logs
    volumes:
      - ${DATA_DIR:-../exercises/dane}:/data:ro
      - app-cache:/app/cache
      - app-logs:/app/logs
      - app-user:/app/user
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Opcjonalny GPU NVIDIA: odkomentuj po skonfigurowaniu NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
volumes:
  ollama-models:
  app-cache:
  app-logs:
  app-user:
