      "schematy": [
        [
          78,
          39
        ],
        [
          76,
          38
        ],
        [
          60,
          20
        ],
        [
          62,
          20
        ],
        [
          70,
          28
        ],
        [
          36.25,
          5
        ],
        [
          40,
          5
        ]
      ]
