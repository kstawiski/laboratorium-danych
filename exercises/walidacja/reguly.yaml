    {
      "id": "id_format",
      "opis": "Kod pacjenta: PR-001..PR-120; bez numerów osobowych.",
      "typ": "format",
      "zmienne": [
        "patient_id"
      ],
      "powaga": "ostrzezenie",
      "kontrola": "format_id",
      "wyrazenie": "~patient_id.str.fullmatch('PR-(?:00[1-9]|0[1-9][0-9]|1[01][0-9]|120)')",
      "wzorzec": "PR-(?:00[1-9]|0[1-9][0-9]|1[01][0-9]|120)"
    },
    {
      "id": "id_unikalny",
      "opis": "Każdy kod pacjenta ma być unikalny; wyjaśnić oba powtarzające się wpisy.",
      "typ": "unikalnosc",
      "zmienne": [
        "patient_id"
      ],
      "powaga": "ostrzezenie",
      "kontrola": "unikalny_id",
      "wyrazenie": "patient_id.duplicated(keep=False)"
    },
    {
      "id": "rekord_duplikat",
      "opis": "Dodatkowy rekord identyczny we wszystkich polach poza ID: podejrzenie duplikatu.",
      "typ": "unikalnosc",
      "zmienne": [
        "patient_id"
      ],
      "powaga": "ostrzezenie",
      "kontrola": "duplikat_rekordu",
      "wyrazenie": "patient_id.duplicated(keep=False)",
      "uwagi": "Kontrola porównuje wszystkie kolumny poza patient_id; samo wyrażenie identyfikatora jest kontrolą pomocniczą."
    },
    {
      "id": "prywatnosc",
      "opis": "Sekwencja 11 cyfr w ID lub notes wymaga usunięcia identyfikatora osobowego.",
      "typ": "format",
      "zmienne": [
        "patient_id",
        "notes"
      ],
      "powaga": "ostrzezenie",
      "kontrola": "prywatnosc",
      "wyrazenie": "patient_id.str.contains(r'(?<!\\d)\\d{11}(?!\\d)') | notes.str.contains(r'(?<!\\d)\\d{11}(?!\\d)')"
