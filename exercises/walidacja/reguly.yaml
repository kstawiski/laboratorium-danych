{
  "wersja": 2,
  "scenariusz": "PROSTATA-RT",
  "uwagi": "wyrazenie: naruszenie (True); zakres: dozwolone granice. Kontrole wielopolowe i formatowe mają jawny identyfikator kontrola oraz parametry. Walidator korzysta z tych parametrów i słownika, pomija wnioskowanie z brakujących lub niemożliwych pomiarów. Wyrażenia agregatowe są pomocnicze; pełne działanie jest opisane przez kontrola, zmienne i parametry.",
