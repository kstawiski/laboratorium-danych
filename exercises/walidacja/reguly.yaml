      ],
      "powaga": "ostrzezenie",
      "kontrola": "daty",
      "wyrazenie": "diagnosis_date > rt_start_date | psa_last_date <= rt_start_date | (death_date != '' & death_date < psa_last_date)",
      "kolejnosc": [
        [
          "birth_date",
          "diagnosis_date"
        ],
        [
          "diagnosis_date",
          "rt_start_date"
        ],
        [
          "rt_start_date",
